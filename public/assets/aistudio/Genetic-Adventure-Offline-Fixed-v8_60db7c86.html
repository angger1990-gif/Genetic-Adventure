planation:"Gen adalah unit dasar pewarisan sifat yang terdiri dari urutan nukleotida DNA penentu sifat organisme.",hint:"Bukan organel atau struktur utuh sel, melainkan fragmen penentu kode spesifik pada DNA.",xp:100,difficulty:1},{id:"q1_2",level:1,cognitiveLevel:"C2",category:"genetics_terms",type:"multiple_choice",question:"Bentuk alternatif atau variasi dari suatu gen yang menempati lokus yang sama pada kromosom homolog disebut...",options:["Alel","Kromatid","Histon","Nukleosom"],answer:"Alel",explanation:"Alel merupakan varian alternatif gen pada lokus yang sama, contohnya alel bunga merah (M) dan bunga putih (m).",hint:"Istilah ini berpasangan untuk menentukan sifat dominan atau resesif.",xp:100,difficulty:1},{id:"q1_3",level:1,cognitiveLevel:"C2",category:"genetics_terms",type:"true_false",question:"Kromosom, DNA, dan gen adalah tiga hal yang identik dan sama persis tanpa struktur tingkatan.",options:["Benar","Salah"],answer:"Salah",explanation:"Salah. Gen adalah bagian dari DNA; DNA terpilin bersama protein histon membentuk kromatin yang memadat menjadi kromosom.",hint:"Pikirkan tingkat organisasi dari molekul hingga struktur makro di dalam nukleus.",xp:100,difficulty:1},{id:"q1_4",level:1,cognitiveLevel:"C2",category:"genotype_phenotype",type:"multiple_choice",question:"Sifat fisik atau karakteristik yang dapat diamati secara langsung pada suatu organisme (seperti warna bunga atau bentuk biji) disebut...",options:["Genotip","Fenotip","Kariotipe","Genom"],answer:"Fenotip",explanation:"Fenotip adalah ekspresi nyata atau penampakan fisik dari genotip yang dipengaruhi lingkungan.",hint:'Awalan "Feno" berkaitan dengan penampakan yang tampak secara visual.',xp:100,difficulty:1},{id:"q1_5",level:1,cognitiveLevel:"C2",category:"genotype_phenotype",type:"multiple_choice",question:"Susunan genetik yang dimiliki suatu organisme dan biasanya dilambangkan dengan huruf (seperti BB, Bb, atau bb) dinamakan...",options:["Genotip","Fenotip","Morfologi","Anatomi"],answer:"Genotip",explanation:"Genotip merupakan komposisi genetik atau kombinasi alel yang menyusun suatu organisme.",hint:"Merupakan kode genetik yang disimbolkan dengan sepasang huruf.",xp:100,difficulty:1},{id:"q1_6",level:1,cognitiveLevel:"C2",category:"genetics_terms",type:"multiple_choice",question:"Sifat atau alel yang selalu menutupi sifat pasangannya ketika hadir bersama-sama disebut...",options:["Dominan","Resesif","Intermediet","Lethal"],answer:"Dominan",explanation:"Alel dominan mengalahkan ekspresi alel resesif pada kondisi heterozigot dan disimbolkan dengan huruf kapital.",hint:"Sifat ini berkuasa/menang atas pasangannya yang tertutup.",xp:100,difficulty:1},{id:"q1_7",level:1,cognitiveLevel:"C2",category:"genetics_terms",type:"multiple_choice",question:"Alel yang sifatnya tertutup dan baru muncul penampakan fisiknya jika berada dalam kondisi homozigot disebut...",options:["Dominan","Resesif","Epistasis","Kodoterminan"],answer:"Resesif",explanation:"Alel resesif hanya mengekspresikan fenotipnya jika berpasangan dengan sesama alel resesif (homozigot resesif).",hint:"Disimbolkan dengan huruf kecil seperti mm atau bb.",xp:100,difficulty:1},{id:"q1_8",level:1,cognitiveLevel:"C2",category:"genotype_phenotype",type:"multiple_choice",question:"Manakah dari pasangan genotip berikut yang merupakan contoh homozigot dominan?",options:["AA","Aa","aa","aA"],answer:"AA",explanation:"Homozigot dominan terdiri atas sepasang alel dominan identik bersimbol huruf kapital (AA).",hint:"Kedua huruf berukuran kapital dan sama persis.",xp:100,difficulty:1},{id:"q1_9",level:1,cognitiveLevel:"C2",category:"genotype_phenotype",type:"multiple_choice",question:'Individu dengan susunan genotip "Mm" disebut berkeadaan...',options:["Homozigot dominan","Homozigot resesif","Heterozigot","Hemizigot"],answer:"Heterozigot",explanation:"Heterozigot adalah keadaan pasangan alel yang terdiri atas alel dominan dan resesif berbeda (satu huruf besar, satu kecil).",hint:'Awalan "hetero-" berarti beraneka at an gamet).",hint:"Kata kuncinya adalah pemisahan pasangan alel.",xp:100,difficulty:2},{id:"q2_3",level:2,cognitiveLevel:"C2",category:"mendel_1",type:"true_false",question:"Hukum Mendel I menyatakan bahwa pasangan alel akan bergabung menjadi satu saat gametogenesis.",options:["Benar","Salah"],answer:"Salah",explanation:"Salah. Hukum Mendel I menyatakan bahwa pasangan alel berpisah (segregasi) secara bebas saat pembentukan gamet.",hint:"Segregasi berarti memisah, bukan bergabung.",xp:100,difficulty:2},{id:"q2_4",level:2,cognitiveLevel:"C2",category:"monohybrid",type:"multiple_choice",question:"Pada persilangan MM (merah) × mm (putih), seluruh keturunan F1 memiliki genotip...",options:["MM","Mm","mm","MMmm"],answer:"Mm",explanation:"Induk MM memberi gamet M dan induk mm memberi gamet m, sehingga seluruh keturunan F1 bergenotip Mm.",hint:"Satu huruf dari induk pertama digabung dengan satu huruf dari induk kedua.",xp:100,difficulty:2},{id:"q2_5",level:2,cognitiveLevel:"C2",category:"monohybrid",type:"multiple_choice",question:"Jika warna merah (M) dominan penuh terhadap putih (m), fenotip dari tanaman F1 (Mm) adalah...",options:["Merah","Putih","Merah muda","Ungu"],answer:"Merah",explanation:"Pada dominansi penuh, alel M menutupi alel m sepenuhnya, sehingga Mm berwarna merah.",hint:"Sifat dominan berkuasa penuh.",xp:100,difficulty:2},{id:"q2_6",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Jika sesama F1 bergenotip Mm disilangkan (Mm × Mm), perbandingan genotip keturunan F2 yang dihasilkan adalah...",options:["1 MM : 2 Mm : 1 mm","3 MM : 1 mm","1 MM : 1 mm","9 MM : 3 Mm : 1 mm"],answer:"1 MM : 2 Mm : 1 mm",explanation:"Persilangan Mm × Mm menghasilkan kemungkinan zigot: MM (25%), Mm (50%), mm (25%), atau rasio 1:2:1.",hint:"Hitung kombinasi kotak Punnett: M dan m bertemu M dan m.",xp:150,difficulty:3},{id:"q2_7",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Berapakah rasio FENOTIP F2 pada persilangan monohibrid dominan penuh antara sesama heterozigot (Mm × Mm)?",options:["3 Merah : 1 Putih","1 Merah : 2 Merah Muda : 1 Putih","1 Merah : 1 Putih","4 Merah : 0 Putih"],answer:"3 Merah : 1 Putih",explanation:"Genotip MM dan Mm (1 + 2 = 3) berfenotip Merah, sedangkan mm (1) berfenotip Putih. Rasionya 3 : 1.",hint:"Gabungkan jumlah individu yang membawa alel dominan M.",xp:150,difficulty:3},{id:"q2_8",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Jika tanaman bergenotip Tt (tinggi) disilangkan dengan tt (kerdil), persentase keturunan yang berbatang tinggi adalah...",options:["50%","25%","75%","100%"],answer:"50%",explanation:"Gamet T dan t dari induk pertama bertemu gamet t dari induk kedua menghasilkan 50% Tt (tinggi) dan 50% tt (kerdil).",hint:"Gunakan papan Punnett 2x1 atau hitung peluang T bertemu t.",xp:150,difficulty:3},{id:"q2_9",level:2,cognitiveLevel:"C3",category:"mendel_1",type:"multiple_choice",question:"Induk bergenotip heterozigot Bb akan menghasilkan sel gamet dengan proporsi...",options:["50% alel B dan 50% alel b","100% alel B","75% alel B dan 25% alel b","100% alel Bb"],answer:"50% alel B dan 50% alel b",explanation:"Sesuai Hukum Segregasi, alel B dan b memisah dengan peluang sama besar (1:1 atau 50%:50%).",hint:"Setiap alel memiliki peluang terpisah yang seimbang saat meiosis.",xp:150,difficulty:3},{id:"q2_10",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Persilangan antara tanaman berbunga merah homozigot (MM) dengan heterozigot (Mm) akan menghasilkan keturunan berfenotip putih sebanyak...",options:["0%","25%","50%","75%"],answer:"0%",explanation:"Induk MM selalu mewariskan alel dominan M kepada semua anak, sehingga tidak mungkin muncul individu homozigot resesif mm.",hint:"Apakah ada peluang bertemunya dua huruf m kecil?",xp:150,difficulty:3},{id:"q2_11",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"drag_drop",question:"Pasangkan jenis persilangan monohibrid berikut dengan rasio fenotip hasil keturunannya!",dragDropPairs:[{item:"Mm × Mm (Dominansi Penuh)",match:"3 Dominan : 1 Resesif"},{item:"Mm × mm (Uji Silang / Testcross)",match:"1 Dominan : 1 Resesif"},{item:"MM × mm",match:"100% Dominan"}],answer:{"Mm × Mm (Dominansi Penuh)":"3 Dominan : 1 Resesif","Mm × mm (Uji Silang / Testcross)":"1 Dominan : 1 Resesif","MM × mm":"100% Dominan"},explanation:"Mm x Mm menghasilkan rasio 3:1, Mm x mm menghasilkan 1:1, dan MM x mm menghasilkan 100% dominan.",hint:"Perhatikan apakah induk resesif memberikan peluang 50:50.",xp:150,difficulty:3},{id:"q2_12",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"punnett_puzzle",question:"Selesaikan persilangan monohibrid Bb × bb pada papan catur Punnett! Tentukan genotip sel anak yang terbentuk.",punnettData:{parent1:"Bb",parent2:"bb",traitName:"Biji"},answer:"Bb dan bb",options:["Semua Bb","50% Bb dan 50% bb","75% Bb dan 25% bb","Semua bb"],explanation:"Gamet B dan b dari Bb dipadukan dengan gamet b dari bb menghasilkan keturunan Bb dan bb masing-masing 50%.",hint:"Gamet baris B dan b bertemu gamet kolom b dan b.",xp:200,difficulty:3},{id:"q2_13",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Pada tanaman Mirabilis jalapa terjadi sifat intermediet (kodominan/semidominan). Jika merah (MM) disilang putih (mm), F1 (Mm) akan berwarna...",options:["Merah muda (pink)","Merah tua","Putih bersih","Bercak merah putih"],answer:"Merah muda (pink)",explanation:"Pada sifat intermediet, alel dominan tidak menutupi resesif secara penuh, menghasilkan sifat campuran merah muda.",hint:"Sifat perantara antara warna merah dan putih.",xp:150,difficulty:3},{id:"q2_14",level:2,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Pada persilangan intermediet sesama merah muda (Mm × Mm), perbandingan fenotip F2 yang terbentuk adalah...",options:["1 Merah : 2 Merah Muda : 1 Putih","3 Merah : 1 Putih","1 Merah : 1 Putih","3 Merah Muda : 1 Putih"],answer:"1 Merah : 2 Merah Muda : 1 Putih",explanation:"Karena heterozigot Mm mengekspresikan fenotip unik (merah muda), rasio fenotip sama dengan rasio genotip (1 MM : 2 Mm : 1 mm).",hint:"Setiap genotip menghasilkan warna yang berbeda.",xp:150,difficulty:3},{id:"q2_15",level:2,cognitiveLevel:"C3",category:"mendel_1",type:"true_false",question:"Pemisahan alel dalam Hukum Segregasi terjadi pada tahap anafase pembelahan meiosis.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Kromosom homolog yang membawa pasangan alel berpisah ke kutub berlawanan saat meiosis I (khususnya anafase I).",hint:"Kaitkan dengan tahapan pembelahan sel reduksi kromosom.",xp:150,difficulty:3},{id:"q2_16",level:2,cognitiveLevel:"C4",category:"analysis",type:"analysis_challenge",question:"Dari 80 tanaman keturunan F2 persilangan monohibrid dominan penuh (Mm × Mm), berapakah perkiraan jumlah tanaman berbunga putih?",options:["20 tanaman","40 tanaman","60 tanaman","80 tanaman"],answer:"20 tanaman",explanation:"Peluang fenotip resesif (putih/mm) adalah 1/4 (25%). Maka 1/4 × 80 tanaman = 20 tanaman.",hint:"Hitung 25% dari total 80 tanaman.",xp:200,difficulty:4},{id:"q2_17",level:2,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Seorang petani menyilangkan tanaman berbuah manis heterozigot (Mm) dengan sesamanya. Jika diperoleh 120 bibit, berapa banyak bibit yang berbuah manis?",options:["90 bibit","30 bibit","60 bibit","120 bibit"],answer:"90 bibit",explanation:"Proporsi fenotip dominan (manis) pada F2 adalah 3/4 (75%). Maka 3/4 × 120 = 90 bibit.",hint:"Rasio manis adalah 3 dari total 4 bagian.",xp:200,difficulty:4},{id:"q2_18",level:2,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Jika kamu ingin memastikan apakah seekor hewan bertelinga panjang bergenotip homozigot (TT) atau heterozigot (Tt), langkah ilmiah yang tepat adalah melakukan persilangan uji (testcross) dengan individu...",options:["Homozigot resesif (tt)","Homozigot dominan (TT)","Heterozigot (Tt)","Individu mana saja bebas"],answer:"Homozigot resesif (tt)",explanation:"Testcross selalu menggunakan pasangan homozigot resesif (tt). Jika muncul keturunan bertelinga pendek (tt), terbukti induk bergenotip heterozigot (Tt).",hint:"Gunakan alel yang tidak akan menutupi sifat alel yang sedang diuji.",xp:200,difficulty:4},{id:"q2_19",level:2,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Jika hasil persilangan antara tanaman ungu dan tanaman putih menghasilkan keturunan 100% ungu, maka genotip tanaman putih pasti homozigot resesif.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Fenotip resesif hanya dapat muncul pada kondisi homozigot resesif.",hint:"Sifat resesif tidak bisa bersembunyi dalam keadaan heterozigot.",xp:200,difficulty:4},{id:"q2_20",level:2,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Persilangan tanaman kacang ercis menghasilkan keturunan dengan rasio 51 batang tinggi dan 49 batang kerdil. Genotip kedua induk yang paling mungkin adalah...",options:["Tt × tt","Tt × Tt","TT × tt","TT × Tt"],answer:"Tt × tt",explanation:"Hasil 51 : 49 mendekati perbandingan 1 : 1 (50% : 50%), yang merupakan ciri khas persilangan heterozigot dengan homozigot resesif (Tt × tt).",hint:"Perhatikan perbandingan angka 51 : 49 yang mendekati seimbang.",xp:200,difficulty:4},{id:"q3_1",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Persilangan yang melibatkan DUA sifat beda sekaligus (misalnya warna bulu dan panjang telinga) disebut persilangan...",options:["Dihibrid","Monohibrid","Polihibrid","Resiprok"],answer:"Dihibrid",explanation:'Dihibrid berasal dari kata "di" (dua) dan "hibrid" (persilangan), mengamati pewarisan dua sifat beda bersamaan.',hint:'Awalan "Di-" artinya dua.',xp:150,difficulty:3},{id:"q3_2",level:3,cognitiveLevel:"C3",category:"mendel_2",type:"multiple_choice",question:"Hukum Mendel II dikenal sebagai Hukum...",options:["Asortasi Bebas","Segregasi Bebas","Dominansi","Tautan Gen"],answer:"Asortasi Bebas",explanation:"Hukum Mendel II menyatakan bahwa alel dari pasangan gen yang berbeda mengelompok secara bebas (asortasi bebas) saat pembentukan gamet.",hint:"Mengatur pengelompokan pasangan gen yang berbeda secara acak/bebas.",xp:150,difficulty:3},{id:"q3_3",level:3,cognitiveLevel:"C3",category:"mendel_2",type:"multiple_choice",question:"Individu kelinci dengan genotip BbLl dapat menghasilkan berapa macam gamet yang berbeda?",options:["4 macam (BL, Bl, bL, bl)","2 macam (BL, bl)","3 macam (Bb, Ll, bl)","1 macam (BbLl)"],answer:"4 macam (BL, Bl, bL, bl)",explanation:"Sesuai rumus 2^n (di mana n = jumlah heterozigot = 2), gamet yang terbentuk ada 2^2 = 4, yaitu BL, Bl, bL, dan bl.",hint:"Kombinasikan setiap huruf dari pasangan pertama dengan setiap huruf pasangan kedua.",xp:150,difficulty:3},{id:"q3_4",level:3,cognitiveLevel:"C3",category:"mendel_2",type:"multiple_choice",question:"Berapakah macam gamet yang dihasilkan oleh individu dengan genotip BBLL?",options:["1 macam: BL","2 macam: B dan L","4 macam: BB, LL, BL, LB","8 macam"],answer:"1 macam: BL",explanation:"Karena kedua pasangan alel berkeadaan homozigot (n = 0), maka hanya terbentuk 1 macam gamet yaitu BL (2^0 = 1).",hint:"Tidak ada huruf kecil atau variasi alel yang berbeda.",xp:150,difficulty:3},{id:"q3_5",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Berapakah jumlah kotak kombinasi pada papan catur Punnett persilangan dihibrid heterozigot (BbLl × BbLl)?",options:["16 kotak","4 kotak","8 kotak","64 kotak"],answer:"16 kotak",explanation:"Karena masing-masing induk menghasilkan 4 macam gamet, maka tabel Punnett berukuran 4 baris × 4 kolom = 16 kotak.",hint:"Kalikan jumlah gamet induk jantan (4) dengan gamet induk betina (4).",xp:150,difficulty:3},{id:"q3_6",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Rasio FENOTIP klasik hasil persilangan dihibrid F2 heterozigot penuh (BbLl × BbLl) adalah...",options:["9 : 3 : 3 : 1","1 : 2 : 1","3 : 1","9 : 7"],answer:"9 : 3 : 3 : 1",explanation:"Rasio fenotip standar Mendel pada persilangan dihibrid heterozigot adalah 9 Dominan-Dominan : 3 Dominan-Resesif : 3 Resesif-Dominan : 1 Resesif-Resesif.",hint:"Total rasio berjumlah 16 (9 + 3 + 3 + 1).",xp:150,difficulty:3},{id:"q3_7",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"true_false",question:"Pada persilangan dihibrid BbLl × BbLl, jumlah individu yang memiliki genotip homozigot resesif ganda (bbll) hanya ada 1 dari 16 kotak.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Peluang bertemunya gamet bl dengan bl adalah 1/4 × 1/4 = 1/16.",hint:"Hanya kotak paling pojok kanan bawah yang menerima alel resesif murni dari kedua orang tua.",xp:150,difficulty:3},{id:"q3_8",level:3,cognitiveLevel:"C3",category:"mendel_2",type:"drag_drop",question:"Pasangkan genotip induk kelinci berikut dengan jumlah variasi gamet yang dapat dibentuknya!",dragDropPairs:[{item:"BBLL",match:"1 Macam Gamet"},{item:"BBLl",match:"2 Macam Gamet"},{item:"BbLl",match:"4 Macam Gamet"}],answer:{BBLL:"1 Macam Gamet",BBLl:"2 Macam Gamet",BbLl:"4 Macam Gamet"},explanation:"Gunakan rumus 2^n di mana n adalah jumlah pasangan alel heterozigot.",hint:"Hitung berapa pasangan huruf yang terdiri atas kombinasi besar-kecil.",xp:150,difficulty:3},{id:"q3_9",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Pada kelinci, B = hitam, b = putih; L = telinga lurus, l = telinga terkulai. Kelinci bergenotip Bbll memiliki fenotip...",options:["Hitam, telinga terkulai","Hitam, telinga lurus","Putih, telinga terkulai","Putih, telinga lurus"],answer:"Hitam, telinga terkulai",explanation:"Bb menghasilkan fenotip hitam (karena B dominan atas b), dan ll homozigot resesif menghasilkan telinga terkulai.",hint:"Alel B dominan hitam, alel ll resesif telinga terkulai.",xp:150,difficulty:3},{id:"q3_10",level:3,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Berapakah persentase keturunan bergenotip BBLL yang diharapkan dari persilangan BbLl × BbLl?",options:["6,25% (1/16)","12,5% (2/16)","18,75% (3/16)","25% (4/16)"],answer:"6,25% (1/16)",explanation:"Genotip BBLL hanya terbentuk dari pertemuan gamet BL dan BL, dengan peluang 1/4 × 1/4 = 1/16 atau 6,25%.",hint:"1 dari 16 kotak.",xp:150,difficulty:3},{id:"q3_11",level:3,cognitiveLevel:"C4",category:"analysis",type:"analysis_challenge",question:"Dari persilangan BbLl × BbLl dihasilkan 160 ekor anak kelinci. Berapakah perkiraan jumlah anak kelinci berbulu putih dengan telinga terkulai (bbll)?",options:["10 ekor","30 ekor","90 ekor","40 ekor"],answer:"10 ekor",explanation:"Peluang fenotip resesif ganda (bbll) pada F2 adalah 1/16. Maka 1/16 × 160 ekor = 10 ekor.",hint:"Gunakan perbandingan rasio 1 dari total 16 bagian terhadap 160 ekor.",xp:200,difficulty:4},{id:"q3_12",level:3,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Dari persilangan BbLl × BbLl dengan 160 anak kelinci, berapakah jumlah anak kelinci yang berfenotip hitam telinga lurus (B_L_)?",options:["90 ekor","30 ekor","10 ekor","60 ekor"],answer:"90 ekor",explanation:"Peluang sifat dominan-dominan adalah 9/16. Maka 9/16 × 160 = 90 ekor anak kelinci.",hint:"9 bagian dari 16 bagian dikalikan 160.",xp:200,difficulty:4},{id:"q3_13",level:3,cognitiveLevel:"C4",category:"mendel_2",type:"multiple_choice",question:"Kondisi mutlak agar Hukum Asortasi Bebas (Mendel II) berlaku secara penuh adalah...",options:["Gen-gen berada pada kromosom non-homolog yang berbeda (tidak terpaut)","Semua gen harus bersifat dominan penuh","Persilangan harus dilakukan pada hewan mamalia saja","Induk harus selalu bergenotip homozigot"],answer:"Gen-gen berada pada kromosom non-homolog yang berbeda (tidak terpaut)",explanation:"Hukum Mendel II hanya berlaku jika gen-gen yang diamati berada pada kromosom yang berbeda sehingga dapat memisah secara bebas tanpa pautan (linkage).",hint:"Jika gen berada pada kromosom yang sama dan berdekatan, mereka akan cenderung terwariskan bersama-sama (tautan).",xp:200,difficulty:4},{id:"q3_14",level:3,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Kelinci hitam telinga lurus heterozigot (BbLl) disilangkan dengan kelinci putih telinga terkulai (bbll). Berapakah perbandingan fenotip anak-anaknya?",options:["1 : 1 : 1 : 1","9 : 3 : 3 : 1","3 : 1","1 : 2 : 1"],answer:"1 : 1 : 1 : 1",explanation:"Ini adalah uji silang dihibrid (dihybrid testcross). Induk pertama menghasilkan gamet BL, Bl, bL, bl (masing-masing 25%) dan induk kedua hanya bl (100%), menghasilkan rasio 1:1:1:1.",hint:"Setiap gamet dari induk heterozigot bertemu satu jenis gamet resesif murni.",xp:200,difficulty:4},{id:"q3_15",level:3,cognitiveLevel:"C4",category:"dihybrid",type:"multiple_choice",question:"Genotip manakah di bawah ini yang akan menghasilkan jumlah keturunan berfenotip sama paling bervariasi jika disilangkan dengan sesamanya?",options:["AaBb","AABB","AAbb","aaBB"],answer:"AaBb",explanation:"Individu heterozigot ganda (AaBb) menghasilkan 4 macam gamet berbeda dan memunculkan 4 kelas fenotip berbeda dengan rasio 9:3:3:1.",hint:"Cari genotip yang memiliki jumlah alel heterozigot terbanyak.",xp:200,difficulty:4},{id:"q3_16",level:3,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Peluang mendapatkan anak kelinci bergenotip BbLl dari persilangan BbLl × BbLl adalah 4/16 (25%).",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Dalam tabel Punnett 16 kotak, genotip heterozigot ganda BbLl muncul tepat pada 4 kotak diagonal.",hint:"Lihat jumlah kemunculan BbLl di sepanjang garis diagonal papan catur.",xp:200,difficulty:4},{id:"q3_17",level:3,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Induk 1 memiliki genotip AABb dan Induk 2 memiliki genotip AaBB. Berapakah peluang terbentuknya keturunan bergenotip AABB?",options:["25% (1/4)","50% (1/2)","12,5% (1/8)","6,25% (1/16)"],answer:"25% (1/4)",explanation:"Peluang lokus A menjadi AA dari AA × Aa adalah 1/2. Peluang lokus B menjadi BB dari Bb × BB adalah 1/2. Peluang gabungan: 1/2 × 1/2 = 1/4 (25%).",hint:"Kalikan peluang pembentukan AA dengan peluang pembentukan BB.",xp:200,difficulty:4},{id:"q3_18",level:3,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Jika seekor kelinci memiliki genotip bbLl, gamet apa saja yang dapat dibentuk oleh kelinci tersebut?",options:["bL dan bl","b dan L","bb dan Ll","BL, Bl, bL, bl"],answer:"bL dan bl",explanation:"Lokus pertama hanya memiliki alel b, sedangkan lokus kedua memiliki alel L dan l. Kombinasinya adalah bL dan bl.",hint:"Lokus pertama tidak memiliki huruf besar B.",xp:200,difficulty:4},{id:"q3_19",level:3,cognitiveLevel:"C4",category:"dihybrid",type:"punnett_puzzle",question:"Tentukan hasil gamet yang dihasilkan oleh induk bergenotip AaBb!",options:["AB, Ab, aB, ab","Aa dan Bb","A, a, B, b","AABB dan aabb"],answer:"AB, Ab, aB, ab",explanation:"Hukum Asortasi Bebas memastikan alel A atau a dapat berpasangan dengan B atau b, menghasilkan 4 kombinasi gamet.",hint:"Empat variasi gabungan huruf satu persatu.",xp:200,difficulty:4},{id:"q3_20",level:3,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Pada persilangan dihibrid BbLl × BbLl, jumlah variasi fenotip yang muncul pada keturunan selalu sama dengan jumlah variasi genotip.",options:["Benar","Salah"],answer:"Salah",explanation:"Salah. Variasi fenotip ada 4 macam (9:3:3:1), sedangkan variasi genotip ada 9 macam (BBLL, BBLl, BBll, BbLL, BbLl, Bbll, bbLL, bbLl, bbll).",hint:"Pikirkan apakah genotip yang berbeda (seperti BBLL dan BbLl) bisa memiliki penampakan fisik yang sama.",xp:200,difficulty:4},{id:"q4_1",level:4,cognitiveLevel:"C3",category:"genotype_phenotype",type:"multiple_choice",question:"Dua tanaman lab berdaun hijau normal disilangkan. Tak disangka, 25% anakannya berdaun albino (putih). Hal ini membuktikan bahwa kedua tanaman induk bergenotip...",options:["Heterozigot (Aa × Aa)","Homozigot dominan (AA × AA)","Homozigot resesif (aa × aa)","Salah satu homozigot (AA × Aa)"],answer:"Heterozigot (Aa × Aa)",explanation:"Keturunan 25% albino (aa) hanya bisa lahir jika kedua induk membawa sifat resesif tersembunyi (carrier/heterozigot Aa).",hint:"Sifat resesif tersembunyi dapat muncul pada 1/4 keturunan jika kedua induk membawa alel tersebut.",xp:150,difficulty:3},{id:"q4_2",level:4,cognitiveLevel:"C3",category:"genotype_phenotype",type:"multiple_choice",question:"Individu yang membawa alel resesif penyebab sifat tertentu tetapi secara fisik tidak menampakkannya disebut sebagai...",options:["Carrier (pembawa sifat)","Mutan","Homozigot","Lethal"],answer:"Carrier (pembawa sifat)",explanation:"Carrier adalah individu bergenotip heterozigot yang membawa alel resesif tanpa mengekspresikannya karena tertutupi oleh alel dominan.",hint:"Istilah dalam bahasa Inggris untuk pembawa muatan/sifat.",xp:150,difficulty:3},{id:"q4_3",level:4,cognitiveLevel:"C3",category:"analysis",type:"true_false",question:"Dua individu yang sama-sama menunjukkan sifat resesif dapat menghasilkan keturunan dengan sifat dominan.",options:["Benar","Salah"],answer:"Salah",explanation:"Salah. Karena kedua individu bergenotip homozigot resesif (aa × aa), seluruh gamet yang dihasilkan hanya membawa alel a, sehingga 100% keturunannya tetap resesif.",hint:"Dari mana alel dominan bisa berasal jika tidak ada satupun induk yang memilikinya?",xp:150,difficulty:3},{id:"q4_4",level:4,cognitiveLevel:"C3",category:"monohybrid",type:"multiple_choice",question:"Pada tanaman ercis, batang tinggi (T) dominan terhadap kerdil (t). Persilangan manakah yang menghasilkan 100% tanaman berbatang tinggi heterozigot?",options:["TT × tt","Tt × Tt","TT × Tt","tt × tt"],answer:"TT × tt",explanation:"Induk TT hanya menghasilkan gamet T, dan tt hanya menghasilkan gamet t. Seluruh keturunan F1 pasti bergenotip Tt (100% tinggi heterozigot).",hint:"Silangkan homozigot dominan murni dengan homozigot resesif murni.",xp:150,difficulty:3},{id:"q4_5",level:4,cognitiveLevel:"C3",category:"analysis",type:"multiple_choice",question:"Pada spesimen tanaman fiktif lab, alel R menghasilkan getah merah dan alel r menghasilkan getah jernih. Jika Rr disilangkan dengan Rr, rasio genotip keturunannya adalah...",options:["1 RR : 2 Rr : 1 rr","3 RR : 1 rr","1 RR : 1 rr","2 Rr : 2 rr"],answer:"1 RR : 2 Rr : 1 rr",explanation:"Persilangan monohibrid antar-heterozigot selalu menghasilkan rasio genotip 1 homozigot dominan : 2 heterozigot : 1 homozigot resesif.",hint:"Rasio klasik genotip monohibrid Mendel.",xp:150,difficulty:3},{id:"q4_6",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Sebuah laboratorium menemukan tanaman spesimen misterius berbatang ungu. Setelah disilangkan dengan tanaman berbatang hijau (resesif, uu), setengah keturunannya berbatang hijau. Genotip tanaman misterius itu adalah...",options:["Uu","UU","uu","UUuu"],answer:"Uu",explanation:"Karena muncul keturunan berbatang hijau (uu), tanaman anak pasti menerima satu alel u dari tanaman misterius. Maka tanaman ungu tersebut bergenotip heterozigot Uu.",hint:"Anak berbatang hijau (uu) membutuhkan satu alel u dari masing-masing induk.",xp:200,difficulty:4},{id:"q4_7",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Jika sepasang serangga laboratorium bersayap lurus menghasilkan 300 keturunan bersayap lurus dan 100 bersayap keriting, maka kemungkinan genotip kedua induk adalah...",options:["Keduanya heterozigot (Ss × Ss)","Keduanya homozigot dominan (SS × SS)","Satu SS dan satu ss","Keduanya homozigot resesif (ss × ss)"],answer:"Keduanya heterozigot (Ss × Ss)",explanation:"Perbandingan 300 : 100 sama dengan 3 : 1. Rasio fenotip 3 : 1 merupakan ciri khas persilangan dua individu heterozigot (Ss × Ss).",hint:"Sederhanakan angka 300 : 100 menjadi perbandingan bulat terkecil.",xp:200,difficulty:4},{id:"q4_8",level:4,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Uji silang (testcross) pada tanaman berfenotip dominan yang menghasilkan 100% keturunan berfenotip dominan membuktikan bahwa tanaman uji tersebut bergenotip homozigot dominan.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Jika induk bergenotip AA disilangkan dengan aa (testcross), seluruh keturunannya bergenotip Aa (100% dominan). Jika induk Aa, akan muncul 50% resesif.",hint:"Pikirkan apakah mungkin ada alel resesif yang lolos jika tidak ada satupun anak yang resesif.",xp:200,difficulty:4},{id:"q4_9",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Dari persilangan Rr × Rr, berapakah peluang seorang peneliti mendapatkan tanaman yang berfenotip dominan sekaligus memiliki genotip heterozigot?",options:["2/3 dari tanaman berfenotip dominan","1/2 dari seluruh tanaman","1/4 dari seluruh tanaman","3/4 dari seluruh tanaman"],answer:"2/3 dari tanaman berfenotip dominan",explanation:"Di antara tanaman yang berfenotip dominan (1 RR dan 2 Rr, total 3 bagian), sebanyak 2 bagian adalah heterozigot (Rr). Jadi peluangnya 2/3.",hint:"Fokuskan ruang sampel hanya pada kelompok tanaman yang berfenotip dominan.",xp:200,difficulty:4},{id:"q4_10",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Pada marmot laboratorium, bulu hitam (B) dominan atas putih (b), dan bulu kasar (R) dominan atas halus (r). Perkawinan Bbrr × bbRr akan menghasilkan rasio fenotip...",options:["1 Hitam Kasar : 1 Hitam Halus : 1 Putih Kasar : 1 Putih Halus","9 Hitam Kasar : 3 Hitam Halus : 3 Putih Kasar : 1 Putih Halus","3 Hitam Kasar : 1 Putih Halus","100% Hitam Kasar"],answer:"1 Hitam Kasar : 1 Hitam Halus : 1 Putih Kasar : 1 Putih Halus",explanation:"Lokus B (Bb × bb) memberi rasio 1:1. Lokus R (rr × Rr) memberi rasio 1:1. Perkalian kedua lokus menghasilkan rasio (1:1) × (1:1) = 1:1:1:1.",hint:"Analisis setiap sifat secara terpisah lalu kalikan peluangnya.",xp:200,difficulty:4},{id:"q4_11",level:4,cognitiveLevel:"C4",category:"analysis",type:"drag_drop",question:"Hubungkan fenomena genetik investigasi berikut dengan penjelasan ilmiahnya!",dragDropPairs:[{item:"Sifat hilang di F1 lalu muncul di F2",match:"Pewarisan sifat resesif"},{item:"Sifat F1 merupakan perpaduan kedua induk",match:"Intermediet / Semidominansi"},{item:"Testcross menghasilkan rasio 1:1",match:"Induk bergenotip heterozigot"}],answer:{"Sifat hilang di F1 lalu muncul di F2":"Pewarisan sifat resesif","Sifat F1 merupakan perpaduan kedua induk":"Intermediet / Semidominansi","Testcross menghasilkan rasio 1:1":"Induk bergenotip heterozigot"},explanation:"Sifat resesif tertutupi di F1 dan muncul kembali di F2; intermediet menghasilkan sifat campuran; testcross 1:1 menandakan heterozigot.",hint:"Ingat kembali ciri khas persilangan klasik Mendel.",xp:200,difficulty:4},{id:"q4_12",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Dua tanaman berbuah besar bergenotip heterozigot (Bb) disilangkan. Jika dihasilkan 4 biji keturunan, berapakah probabilitas keempat-empatnya berbuah besar?",options:["(3/4)^4 = 81/256 (~31,6%)","(1/4)^4 = 1/256","3/4 (~75%)","1/2 (50%)"],answer:"(3/4)^4 = 81/256 (~31,6%)",explanation:"Peluang satu biji berbuah besar adalah 3/4. Karena setiap peristiwa pembuahan independen, peluang 4 biji berbuah besar adalah (3/4) × (3/4) × (3/4) × (3/4) = 81/256.",hint:"Gunakan aturan perkalian peluang untuk kejadian independen.",xp:200,difficulty:4},{id:"q4_13",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Dalam penelitian mutasi netral pada ragi, mutasi resesif m menyebabkan koloni lambat tumbuh. Jika galur diploid Mm mengalami pembelahan sel meiosis, berapa persen spora yang membawa alel mutan m?",options:["50%","25%","75%","100%"],answer:"50%",explanation:"Hukum Segregasi memastikan separuh (50%) dari total produk meiosis membawa alel M dan separuh (50%) membawa alel m.",hint:"Pemisahan satu pasang alel menghasilkan proporsi seimbang.",xp:200,difficulty:4},{id:"q4_14",level:4,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Penyelidikan silsilah persilangan tanaman menunjukkan bahwa sifat albino hanya muncul pada generasi cucu ketika terjadi penyerbukan sendiri. Ini membuktikan sifat albino bersifat resesif.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Sifat resesif sering tersembunyi selama beberapa generasi dalam keadaan heterozigot dan baru terekspresi saat terjadi perkawinan sesama pembawa sifat.",hint:"Sifat dominan tidak dapat bersembunyi di generasi perantara.",xp:200,difficulty:4},{id:"q4_15",level:4,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Manakah dari data persilangan berikut yang TIDAK sesuai dengan hukum penurunan sifat Mendel?",options:["Persilangan homozigot resesif × homozigot resesif menghasilkan keturunan dominan","Persilangan heterozigot × heterozigot menghasilkan rasio fenotip 3:1","Persilangan heterozigot × homozigot resesif menghasilkan rasio fenotip 1:1","Persilangan homozigot dominan × homozigot resesif menghasilkan keturunan 100% heterozigot"],answer:"Persilangan homozigot resesif × homozigot resesif menghasilkan keturunan dominan",explanation:"Mustahil persilangan aa × aa menghasilkan fenotip dominan (A_) tanpa adanya mutasi genetik baru.",hint:"Cari pernyataan yang menghasilkan sifat yang tidak dimiliki oleh kedua induk.",xp:200,difficulty:4},{id:"q4_16",level:4,cognitiveLevel:"C5",category:"analysis",type:"analysis_challenge",question:"Sebuah laboratorium ingin memurnikan bibit tanaman agar selalu menghasilkan buah manis (dominan). Metode seleksi ilmiah yang paling efisien adalah...",options:["Melakukan penyerbukan sendiri pada tanaman manis dan hanya memilih tanaman yang keturunannya 100% manis tanpa ada yang asam","Menyilangkan tanaman manis dengan tanaman asam sekali saja lalu mengambil semua bijinya","Memupuk tanaman dengan nutrisi manis secara berlebihan","Mengambil tanaman manis secara acak dari alam bebas"],answer:"Melakukan penyerbukan sendiri pada tanaman manis dan hanya memilih tanaman yang keturunannya 100% manis tanpa ada yang asam",explanation:"Tanaman manis galur murni (MM) jika menyerbuk sendiri tidak akan pernah menghasilkan anakan asam (mm). Tanaman heterozigot (Mm) akan menghasilkan 25% asam.",hint:"Galur murni diperoleh jika tidak ada lagi alel resesif yang tersembunyi.",xp:250,difficulty:5},{id:"q4_17",level:4,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika kamu diberikan sampel biji kacang ercis berwarna kuning dan diminta membuktikan apakah biji tersebut bergenotip YY atau Yy, percobaan manakah yang paling cepat dan akurat?",options:["Menanamnya lalu menyilangkan bunganya dengan tanaman berbiji hijau (yy)","Menyilangkannya dengan tanaman berbiji kuning lain yang tidak diketahui genotipnya","Mengukur diameter dan berat biji dengan mikrometer sekrup","Menanamnya di tempat gelap selama sebulan"],answer:"Menanamnya lalu menyilangkan bunganya dengan tanaman berbiji hijau (yy)",explanation:"Testcross dengan galur murni resesif (yy) adalah metode baku genetika. Jika muncul satu saja biji hijau, maka tanaman terbukti Yy. Jika semua kuning, kemungkinan besar YY.",hint:"Gunakan prinsip uji silang (testcross) Mendel.",xp:250,difficulty:5},{id:"q4_18",level:4,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Analisis kasus: Dua strain bakteri non-patogen disilangkan. Sifat resisten antibiotik bersifat resesif (rr). Di antara 1.000 koloni hasil persilangan Rr × Rr, secara teoritis berapakah jumlah koloni yang rentan (tidak resisten)?",options:["750 koloni","250 koloni","500 koloni","1.000 koloni"],answer:"750 koloni",explanation:"Koloni rentan memiliki genotip dominan (RR atau Rr) sebesar 75% (3/4). Maka 3/4 × 1.000 = 750 koloni.",hint:"Hati-hati membaca: yang ditanyakan adalah sifat rentan (dominan), bukan sifat resisten (resesif).",xp:250,difficulty:5},{id:"q4_19",level:4,cognitiveLevel:"C5",category:"analysis",type:"true_false",question:"Dalam sebuah populasi tanaman terisolasi, persentase tanaman resesif selalu bertambah banyak seiring berjalannya waktu meskipun tidak ada seleksi alam.",options:["Benar","Salah"],answer:"Salah",explanation:"Salah. Menurut prinsip kesetimbangan genetik, frekuensi alel dominan dan resesif tetap stabil dari generasi ke generasi selama tidak ada faktor evolusi/seleksi yang mengubahnya.",hint:"Sifat resesif tidak otomatis bertambah atau punah dengan sendirinya.",xp:250,difficulty:5},{id:"q4_20",level:4,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika genotip P1 adalah AaBbCc, berapakah macam gamet berbeda yang dapat diproduksi oleh individu tersebut berdasarkan Hukum Mendel?",options:["8 macam (2^3)","6 macam","16 macam","4 macam"],answer:"8 macam (2^3)",explanation:"Rumus kombinasi gamet bebas adalah 2^n di mana n adalah jumlah lokus heterozigot. Di sini n = 3 (Aa, Bb, Cc), sehingga 2^3 = 8 macam gamet.",hint:"Gunakan rumus eksponensial 2 pangkat n.",xp:250,difficulty:5},{id:"q5_1",level:5,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Pada tanaman jagung: K = biji kuning, k = biji putih; B = biji bulat, b = biji keriput. Tanaman bergenotip KkBb memiliki fenotip...",options:["Kuning bulat","Kuning keriput","Putih bulat","Putih keriput"],answer:"Kuning bulat",explanation:"Karena alel K (kuning) dominan atas k dan B (bulat) dominan atas b, individu heterozigot ganda berfenotip kuning bulat.",hint:"Kombinasi kedua alel dominan.",xp:150,difficulty:3},{id:"q5_2",level:5,cognitiveLevel:"C3",category:"dihybrid",type:"multiple_choice",question:"Persilangan jagung heterozigot ganda KkBb × KkBb menghasilkan 16 variasi kombinasi pada papan catur. Berapa macam gamet yang dihasilkan masing-masing induk?",options:["4 macam: KB, Kb, kB, kb","2 macam: Kk, Bb","1 macam: KkBb","8 macam"],answer:"4 macam: KB, Kb, kB, kb",explanation:"Setiap induk KkBb menghasilkan 4 macam gamet dengan probabilitas masing-masing 25% (KB, Kb, kB, kb).",hint:"Gabungkan tiap variasi huruf K dengan huruf B.",xp:150,difficulty:3},{id:"q5_3",level:5,cognitiveLevel:"C3",category:"analysis",type:"multiple_choice",question:"Jika dari persilangan KkBb × KkBb diamati total 160 tanaman jagung F2, berapa jumlah teoritis tanaman berbiji kuning bulat?",options:["90 tanaman","30 tanaman","10 tanaman","160 tanaman"],answer:"90 tanaman",explanation:"Proporsi kuning bulat (K_B_) adalah 9/16. Maka 9/16 × 160 tanaman = 90 tanaman.",hint:"Hitung (9 / 16) × 160.",xp:150,difficulty:3},{id:"q5_4",level:5,cognitiveLevel:"C3",category:"analysis",type:"multiple_choice",question:"Dari 160 tanaman jagung hasil persilangan KkBb × KkBb di atas, berapakah jumlah teoritis tanaman berbiji kuning keriput (K_bb)?",options:["30 tanaman","90 tanaman","10 tanaman","40 tanaman"],answer:"30 tanaman",explanation:"Proporsi kuning keriput (K_bb) adalah 3/16. Maka 3/16 × 160 = 30 tanaman.",hint:"Hitung (3 / 16) × 160.",xp:150,difficulty:3},{id:"q5_5",level:5,cognitiveLevel:"C3",category:"analysis",type:"multiple_choice",question:"Dari 160 tanaman jagung tersebut, berapakah jumlah tanaman berbiji putih keriput (kkbb)?",options:["10 tanaman","30 tanaman","90 tanaman","5 tanaman"],answer:"10 tanaman",explanation:"Proporsi resesif ganda (kkbb) adalah 1/16. Maka 1/16 × 160 = 10 tanaman.",hint:"Hitung (1 / 16) × 160.",xp:150,difficulty:3},{id:"q5_6",level:5,cognitiveLevel:"C4",category:"analysis",type:"sorting",question:"Urutkan kelompok fenotip hasil persilangan dihibrid KkBb × KkBb (populasi 160 tanaman) dari jumlah terbanyak hingga tersedikit!",sortingItems:["Putih Keriput (10)","Kuning Keriput (30)","Kuning Bulat (90)","Putih Bulat (30)"],answer:["Kuning Bulat (90)","Kuning Keriput (30)","Putih Bulat (30)","Putih Keriput (10)"],explanation:"Urutan jumlah adalah 90 (Kuning Bulat) > 30 (Kuning Keriput) = 30 (Putih Bulat) > 10 (Putih Keriput), sesuai rasio 9:3:3:1.",hint:"Rasio 9 : 3 : 3 : 1 menunjukkan urutan dari yang paling melimpah ke paling langka.",xp:200,difficulty:4},{id:"q5_7",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Di antara 160 tanaman jagung F2 di atas, berapa banyakkah tanaman yang memiliki genotip galur murni homozigot untuk KEDUA sifat (KKBB, KKbb, kkBB, atau kkbb)?",options:["40 tanaman (4/16)","10 tanaman (1/16)","20 tanaman (2/16)","80 tanaman (8/16)"],answer:"40 tanaman (4/16)",explanation:"Genotip homozigot ganda ada 4 kotak dari 16 (KKBB, KKbb, kkBB, kkbb). Maka peluangnya 4/16 = 1/4. 1/4 × 160 = 40 tanaman.",hint:"Terdapat 4 kotak homozigot ganda di dalam papan catur 16 kotak.",xp:200,difficulty:4},{id:"q5_8",level:5,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Jika seorang siswa menghitung data riil di ladang jagung dan mendapatkan 88 kuning bulat, 31 kuning keriput, 29 putih bulat, dan 12 putih keriput dari 160 tanaman, data ini tetap mendukung Hukum Mendel.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Dalam biologi nyata, data empiris memiliki deviasi acak alami namun rasio 88:31:29:12 sangat mendekati rasio ideal 90:30:30:10 (9:3:3:1).",hint:"Pikirkan apakah data eksperimen selalu 100% tepat sama persis dengan angka teori.",xp:200,difficulty:4},{id:"q5_9",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Berapakah persentase keturunan jagung yang berfenotip minimal memiliki SATU sifat dominan pada persilangan KkBb × KkBb?",options:["93,75% (15/16)","75% (12/16)","56,25% (9/16)","100% (16/16)"],answer:"93,75% (15/16)",explanation:"Hanya fenotip resesif ganda (1/16 = 6,25%) yang tidak memiliki sifat dominan sama sekali. Sisanya adalah 16/16 - 1/16 = 15/16 (93,75%).",hint:"Kurangkan 100% dengan persentase resesif murni.",xp:200,difficulty:4},{id:"q5_10",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Persilangan jagung KkBb dengan jagung kkbb (testcross) menghasilkan 400 tongkol jagung. Berapakah perkiraan jumlah jagung berbiji kuning bulat?",options:["100 tongkol","200 tongkol","50 tongkol","225 tongkol"],answer:"100 tongkol",explanation:"Testcross dihibrid menghasilkan rasio 1:1:1:1 (masing-masing 1/4 atau 25%). Maka 25% × 400 tongkol = 100 tongkol.",hint:"Bagi 400 sama rata ke dalam 4 kelas fenotip testcross.",xp:200,difficulty:4},{id:"q5_11",level:5,cognitiveLevel:"C4",category:"analysis",type:"drag_drop",question:"Pasangkan proporsi teoritis pada 160 tanaman jagung F2 dengan kelas fenotipnya!",dragDropPairs:[{item:"90 Tanaman (56,25%)",match:"Kuning Bulat"},{item:"30 Tanaman (18,75%)",match:"Kuning Keriput / Putih Bulat"},{item:"10 Tanaman (6,25%)",match:"Putih Keriput"}],answer:{"90 Tanaman (56,25%)":"Kuning Bulat","30 Tanaman (18,75%)":"Kuning Keriput / Putih Bulat","10 Tanaman (6,25%)":"Putih Keriput"},explanation:"Rasio 9:3:3:1 pada 160 tanaman menghasilkan 90, 30, 30, dan 10 tanaman.",hint:"Ingat kembali kalkulasi fraksi per 16.",xp:200,difficulty:4},{id:"q5_12",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Seorang pemulia tanaman jagung hanya ingin menanam jagung berbiji putih bulat (kkB_). Jika ia menyilangkan tanaman kkBb dengan kkBb, berapa persen keturunannya yang sesuai harapan?",options:["75% (3/4)","25% (1/4)","50% (1/2)","100%"],answer:"75% (3/4)",explanation:"Kedua induk sudah bergenotip kk (100% putih). Persilangan Bb × Bb menghasilkan 3/4 bulat (B_) dan 1/4 keriput (bb). Jadi 75% putih bulat.",hint:"Sifat warna sudah pasti 100% putih, tinggal hitung peluang biji bulat dari Bb x Bb.",xp:200,difficulty:4},{id:"q5_13",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Dari persilangan KkBb × KkBb, berapakah frekuensi kemunculan genotip KkBB pada keturunan?",options:["2/16 (12,5%)","1/16 (6,25%)","4/16 (25%)","3/16 (18,75%)"],answer:"2/16 (12,5%)",explanation:"Peluang Kk adalah 2/4 dan BB adalah 1/4. Maka peluang KkBB adalah 2/4 × 1/4 = 2/16 (12,5%).",hint:"Kalikan probabilitas heterozigot pada lokus 1 dengan homozigot dominan lokus 2.",xp:200,difficulty:4},{id:"q5_14",level:5,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Dua tanaman jagung berfenotip kuning bulat heterozigot sempurna dapat menghasilkan keturunan dengan 9 variasi genotip yang berbeda.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. 3 variasi genotip lokus K (KK, Kk, kk) dikalikan 3 variasi genotip lokus B (BB, Bb, bb) menghasilkan 3 × 3 = 9 variasi genotip.",hint:"3 variasi genotip pada lokus pertama × 3 variasi genotip pada lokus kedua.",xp:200,difficulty:4},{id:"q5_15",level:5,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Pada eksperimen jagung, jika gen K dan B ternyata berada pada satu kromosom yang sama dan berjarak sangat dekat (terpaut erat), rasio fenotip F2 yang akan didapatkan adalah...",options:["Menyimpang dari 9:3:3:1 dan cenderung mendekati rasio monohibrid 3:1","Tetap persis 9:3:3:1 tanpa perubahan","Menjadi 1:1:1:1:1:1:1:1","Semua tanaman menjadi mutan mandul"],answer:"Menyimpang dari 9:3:3:1 dan cenderung mendekati rasio monohibrid 3:1",explanation:"Tautan gen (gene linkage) mencegah asortasi bebas terjadi, sehingga kedua gen diwariskan bersama seperti satu kesatuan monohibrid.",hint:"Ketika dua gen terikat pada satu kendaraan kromosom yang sama, mereka tidak bisa berpisah secara bebas.",xp:200,difficulty:4},{id:"q5_16",level:5,cognitiveLevel:"C5",category:"analysis",type:"analysis_challenge",question:"Seorang peneliti mengamati mutasi pada tanaman jagung: alel mutan kerdil m hanya aktif jika alel warna bergenotip putih (kk). Fenomena interaksi antargen di mana suatu gen menutupi ekspresi gen lain disebut...",options:["Epistasis - Hipostasis","Kodominansi","Pautan Seks","Kriptomeri murni"],answer:"Epistasis - Hipostasis",explanation:"Epistasis adalah peristiwa di mana gen dominan atau resesif pada satu lokus menutupi penampakan gen pada lokus lain yang bukan alelnya.",hint:"Gen yang menutupi disebut epistasis, yang tertutupi disebut hipostasis.",xp:250,difficulty:5},{id:"q5_17",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Dalam suatu uji chi-square (uji kecocokan) data genetika jagung, nilai deviasi yang sangat kecil antara data pengamatan (observed) dan data harapan (expected) menunjukkan bahwa...",options:["Data hasil percobaan sangat sesuai dan mendukung hipotesis Hukum Mendel","Percobaan harus diulang karena ada kesalahan teknis","Hukum Mendel tidak berlaku pada tanaman tersebut","Telah terjadi mutasi genetik massal"],answer:"Data hasil percobaan sangat sesuai dan mendukung hipotesis Hukum Mendel",explanation:"Nilai selisih yang kecil antara data nyata dan data teori membuktikan bahwa model penurunan sifat Mendel berlaku dengan validitas tinggi.",hint:"Makin kecil perbedaan antara teori dan kenyataan, makin kuat kebenaran teorinya.",xp:250,difficulty:5},{id:"q5_18",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika kamu memiliki tanaman jagung bergenotip KKBb dan tanaman kkBb, berapa persen kemungkinan keturunannya berfenotip kuning keriput?",options:["25% (1/4)","50% (1/2)","0%","75% (3/4)"],answer:"25% (1/4)",explanation:"Lokus K: KK × kk menghasilkan 100% Kk (kuning). Lokus B: Bb × Bb menghasilkan 1/4 bb (keriput). Maka kuning keriput = 1 × 1/4 = 25%.",hint:"Semua anak pasti kuning (Kk), lalu hitung peluang anakan berbiji keriput (bb).",xp:250,difficulty:5},{id:"q5_19",level:5,cognitiveLevel:"C5",category:"analysis",type:"true_false",question:"Untuk mendapatkan galur murni tanaman jagung kuning keriput (KKbb), petani dapat menyilangkan sesama jagung kuning keriput yang sudah terbukti homozigot.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Jika kedua induk bergenotip KKbb × KKbb, seluruh keturunannya 100% KKbb secara permanen karena tidak ada alel lain yang masuk.",hint:"Galur murni homozigot yang disilangkan sesamanya tidak akan menghasilkan variasi lain.",xp:250,difficulty:5},{id:"q5_20",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Persilangan trihibrid (tiga sifat beda) AaBbCc × AaBbCc secara teoritis akan menghasilkan kotak kombinasi Punnett sebanyak...",options:["64 kotak (4 × 4 × 4)","16 kotak","32 kotak","128 kotak"],answer:"64 kotak (4 × 4 × 4)",explanation:"Masing-masing induk menghasilkan 2^3 = 8 macam gamet. Tabel Punnett berukuran 8 × 8 = 64 kotak kombinasi.",hint:"8 gamet jantan dikalikan 8 gamet betina.",xp:250,difficulty:5},{id:"q5_21",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Di antara 160 bibit jagung hasil persilangan dihibrid heterozigot, berapakah jumlah tanaman yang diestimasikan memiliki genotip heterozigot ganda (KkBb)?",options:["40 tanaman (4/16)","90 tanaman","20 tanaman","10 tanaman"],answer:"40 tanaman (4/16)",explanation:"Peluang genotip heterozigot ganda KkBb adalah 4/16 (25%). Pada populasi 160 tanaman: 4/16 × 160 = 40 tanaman.",hint:"Terdapat 4 kotak diagonal pada tabel catur 16 kotak.",xp:250,difficulty:5},{id:"q5_22",level:5,cognitiveLevel:"C5",category:"analysis",type:"true_false",question:"Sifat kuantitatif seperti tinggi tanaman yang dipengaruhi oleh banyak gen berbeda (poligenik) menghasilkan kurva distribusi fenotip berbentuk lonceng (kurva normal).",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Pewarisan poligenik menghasilkan variasi kontinu yang membentuk grafik lonceng distribusi normal.",hint:"Banyak variasi tinggi dari sangat pendek, sedang, hingga sangat tinggi.",xp:250,difficulty:5},{id:"q5_23",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Manakah kesimpulan yang paling tepat mengenai perbandingan Hukum Mendel I dan Hukum Mendel II?",options:["Hukum I menjelaskan pemisahan alel se-lokus, sedangkan Hukum II menjelaskan pengelompokan bebas alel antar-lokus berbeda","Hukum I hanya berlaku untuk tanaman, sedangkan Hukum II untuk hewan","Hukum I menghasilkan rasio 9:3:3:1, sedangkan Hukum II menghasilkan 3:1","Hukum I tidak melibatkan pembelahan meiosis sama sekali"],answer:"Hukum I menjelaskan pemisahan alel se-lokus, sedangkan Hukum II menjelaskan pengelompokan bebas alel antar-lokus berbeda",explanation:"Hukum Mendel I berfokus pada segregasi pasangan alel pada satu lokus gen yang sama, sedangkan Hukum Mendel II berfokus pada asortasi bebas antara gen-gen pada lokus berbeda.",hint:"Bandingkan konsep segregasi satu lokus dengan asortasi multi-lokus.",xp:250,difficulty:5},{id:"q5_24",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Berapakah probabilitas memungut secara acak sebutir biji jagung bergenotip homozigot resesif kkbb dari ladang hasil persilangan KkBb × KkBb?",options:["1/16 atau 6,25%","3/16 atau 18,75%","9/16 atau 56,25%","1/4 atau 25%"],answer:"1/16 atau 6,25%",explanation:"Hanya 1 dari 16 kotak kombinasi yang bergenotip kkbb (1/16 = 6,25%).",hint:"Peluang terkecil pada persilangan dihibrid klasik.",xp:250,difficulty:5},{id:"q5_25",level:5,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika diketahui bahwa persilangan dua galur jagung menghasilkan keturunan dengan rasio fenotip 9 : 7, penyimpangan semu hukum Mendel ini disebabkan oleh...",options:["Gen komplementer (dua gen saling melengkapi untuk memunculkan fenotip)","Epistasis dominan","Polimeri","Tautan gen kelamin"],answer:"Gen komplementer (dua gen saling melengkapi untuk memunculkan fenotip)",explanation:"Pada gen komplementer, kehadiran alel dominan dari kedua gen (A_B_) mutlak diperlukan untuk memunculkan sifat. Ketiadaan salah satu alel dominan menyebabkan fenotip resesif (9 : 3+3+1 = 9 : 7).",hint:"Kedua gen harus saling melengkapi untuk menghasilkan warna.",xp:250,difficulty:5},{id:"q6_1",level:6,cognitiveLevel:"C2",category:"mendel_1",type:"multiple_choice",question:'Prinsip utama yang dijalankan oleh Mesin Genetika I (Hukum Segregasi) saat memproses genotip "Aa" adalah...',options:["Memisahkan alel A dan a ke dalam gamet yang berbeda secara bebas","Menggabungkan alel A dan a menjadi genotip baru","Mengubah alel a menjadi alel dominan A","Menghancurkan alel resesif a"],answer:"Memisahkan alel A dan a ke dalam gamet yang berbeda secara bebas",explanation:"Mesin I merepresentasikan Hukum Segregasi: pasangan alel berpisah (segregasi) sehingga masing-masing gamet hanya membawa satu alel dari pasangannya.",hint:"Segregasi berarti pemisahan pasangan alel.",xp:100,difficulty:2},{id:"q6_2",level:6,cognitiveLevel:"C2",category:"mendel_2",type:"multiple_choice",question:'Prinsip utama yang dijalankan oleh Mesin Genetika II (Hukum Asortasi Bebas) saat memproses genotip "AaBb" adalah...',options:["Menyusun kombinasi alel dari gen-gen yang berbeda secara bebas menjadi gamet AB, Ab, aB, dan ab","Memaksa alel A selalu berpasangan dengan B","Menghilangkan alel kecil a dan b","Membuat semua keturunan menjadi seragam"],answer:"Menyusun kombinasi alel dari gen-gen yang berbeda secara bebas menjadi gamet AB, Ab, aB, dan ab",explanation:"Mesin II merepresentasikan Hukum Asortasi Bebas: alel dari pasangan gen yang berbeda mengelompok secara independen saat pembentukan gamet.",hint:"Asortasi bebas menghasilkan 4 variasi kombinasi gamet.",xp:100,difficulty:2},{id:"q6_3",level:6,cognitiveLevel:"C2",category:"genetics_terms",type:"multiple_choice",question:'Siapakah tokoh ilmuwan yang dikenal sebagai "Bapak Genetika Modern" atas eksperimen kacang ercisnya?',options:["Gregor Johann Mendel","Charles Darwin","Louis Pasteur","Robert Hooke"],answer:"Gregor Johann Mendel",explanation:"Gregor Mendel adalah biarawan dan ilmuwan yang merumuskan hukum dasar pewarisan sifat (Hukum Mendel I dan II).",hint:'Nama depan tokoh yang menjadi inspirasi gelar "Mendel Master".',xp:100,difficulty:2},{id:"q6_4",level:6,cognitiveLevel:"C2",category:"genetics_terms",type:"true_false",question:"Gamet betina (sel telur) dan gamet jantan (sperma/serbuk sari) menyumbangkan jumlah materi genetik kromosom inti yang sama bagi keturunan.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Keduanya masing-masing menyumbangkan satu set haploid kromosom (n) untuk membentuk zigot diploid (2n).",hint:"Keturunan menerima separuh set kromosom dari ayah dan separuh dari ibu.",xp:100,difficulty:2},{id:"q6_5",level:6,cognitiveLevel:"C2",category:"genetics_terms",type:"multiple_choice",question:"Alasan utama Gregor Mendel memilih tanaman kacang ercis (Pisum sativum) sebagai objek penelitiannya adalah...",options:["Mudah disilangkan, memiliki sifat beda yang mencolok, dan cepat menghasilkan keturunan","Karena ukurannya paling besar di antara tanaman lain","Karena tidak memiliki sifat resesif sama sekali","Karena hanya dapat hidup di dalam laboratorium tertutup"],answer:"Mudah disilangkan, memiliki sifat beda yang mencolok, dan cepat menghasilkan keturunan",explanation:"Pisum sativum memiliki siklus hidup pendek, sifat kontras yang jelas (bunga ungu/putih, biji bulat/keriput), dan dapat melakukan penyerbukan sendiri maupun silang.",hint:"Pikirkan faktor kemudahan pengamatan dan kecepatan siklus hidup tanaman.",xp:100,difficulty:2},{id:"q6_6",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:'Ketika Mesin I memproses genotip "Mm", output gamet yang keluar dari corong pemisah adalah...',options:["Gamet M dan Gamet m","Hanya gamet M","Hanya gamet m","Gamet Mm utuh"],answer:"Gamet M dan Gamet m",explanation:"Segregasi memisahkan alel homolog M dan m menjadi dua jenis gamet yang terpisah.",hint:"Kedua alel terpisah ke dua jalur output yang berbeda.",xp:200,difficulty:4},{id:"q6_7",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:'Ketika Mesin II memproses genotip "Aabb", output gamet yang akan dihasilkan adalah...',options:["Ab dan ab","AB, Ab, aB, ab","A, a, b","Aa dan bb"],answer:"Ab dan ab",explanation:"Lokus A menghasilkan alel A dan a. Lokus B hanya memiliki alel b. Kombinasinya adalah Ab dan ab.",hint:"Lokus kedua tidak memiliki huruf besar B.",xp:200,difficulty:4},{id:"q6_8",level:6,cognitiveLevel:"C4",category:"analysis",type:"sorting",question:"Urutkan tahapan alur pembentukan gamet dan fertilisasi sesuai Hukum Mendel berikut!",sortingItems:["Pemisahan alel homolog (Segregasi)","Pengelompokan bebas antar-alel (Asortasi)","Pembentukan sel gamet haploid","Penyatuan gamet jantan dan betina membentuk zigot diploid"],answer:["Pemisahan alel homolog (Segregasi)","Pengelompokan bebas antar-alel (Asortasi)","Pembentukan sel gamet haploid","Penyatuan gamet jantan dan betina membentuk zigot diploid"],explanation:"Urutan biologis: Segregasi alel homolog -> Asortasi bebas kombinasi gen -> Matangnya sel gamet haploid -> Fertilisasi menghasilkan zigot diploid.",hint:"Mulai dari pemisahan kromosom di meiosis hingga pertemuan sel sperma dan ovum.",xp:200,difficulty:4},{id:"q6_9",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Pada pertempuran melawan Mendel Chaos, serangan manakah yang mengeksploitasi kelemahan fase monohibrid boss?",options:["Membuktikan bahwa MM × mm menghasilkan 100% fenotip dominan","Menyatakan bahwa semua alel selalu terpaut bersama","Mengabaikan hukum segregasi","Mengubah genotip tanpa pembelahan sel"],answer:"Membuktikan bahwa MM × mm menghasilkan 100% fenotip dominan",explanation:"Pengetahuan ilmiah yang benar bahwa persilangan galur murni dominan dan resesif menghasilkan 100% anakan berfenotip dominan memecahkan perisai konsep boss.",hint:"Gunakan hukum dasar persilangan P1 galur murni.",xp:200,difficulty:4},{id:"q6_10",level:6,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Jika dua gen terletak pada kromosom yang berbeda, peluang kedua gen tersebut diwariskan bersama ke satu gamet dapat dihitung dengan mengalikan probabilitas masing-masing alel.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Aturan perkalian probabilitas berlaku untuk peristiwa-peristiwa yang bersifat independen (bebas).",hint:"P = P(A) × P(B) untuk peristiwa independen.",xp:200,difficulty:4},{id:"q6_11",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Perhatikan persilangan: AaBbCcDd × AaBbCcDd. Berapakah peluang mendapatkan keturunan dengan genotip homozigot resesif penuh aabbccdd?",options:["1/256 ((1/4)^4)","1/64","1/16","1/1024"],answer:"1/256 ((1/4)^4)",explanation:"Peluang homozigot resesif pada setiap lokus adalah 1/4. Karena keempat lokus berasortasi bebas, peluang total adalah 1/4 × 1/4 × 1/4 × 1/4 = 1/256.",hint:"Kalikan (1/4) sebanyak 4 kali.",xp:200,difficulty:4},{id:"q6_12",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:'Suatu tanaman memiliki genotip AaBb. Jika 1.000 sel serbuk sari terbentuk, secara teoritis berapakah jumlah serbuk sari yang membawa kombinasi alel "ab"?',options:["250 sel (25%)","500 sel","100 sel","750 sel"],answer:"250 sel (25%)",explanation:"Keempat macam gamet (AB, Ab, aB, ab) diproduksi dalam proporsi seimbang 1/4 (25%). 25% dari 1.000 adalah 250 sel.",hint:"Bagi 1.000 sama rata ke dalam 4 jenis gamet.",xp:200,difficulty:4},{id:"q6_13",level:6,cognitiveLevel:"C4",category:"analysis",type:"drag_drop",question:"Pasangkan fase pertempuran Final Boss Mendel Chaos dengan kompetensi genetika yang diujinya!",dragDropPairs:[{item:"Fase 1 Mendel Chaos",match:"Konsep Dasar Genetika & DNA/Kromosom"},{item:"Fase 2 Mendel Chaos",match:"Persilangan Monohibrid & Punnett"},{item:"Fase 3 Mendel Chaos",match:"Dihibrid, Hukum Mendel I & II, dan Analisis Data"}],answer:{"Fase 1 Mendel Chaos":"Konsep Dasar Genetika & DNA/Kromosom","Fase 2 Mendel Chaos":"Persilangan Monohibrid & Punnett","Fase 3 Mendel Chaos":"Dihibrid, Hukum Mendel I & II, dan Analisis Data"},explanation:"Pertarungan boss final menguji penguasaan materi bertahap dari konsep awal hingga integrasi hukum Mendel menyeluruh.",hint:"Tingkatan tantangan meningkat dari konsep dasar hingga sintesis menyeluruh.",xp:200,difficulty:4},{id:"q6_14",level:6,cognitiveLevel:"C4",category:"analysis",type:"multiple_choice",question:"Jika persilangan antara bunga merah dan bunga putih menghasilkan keturunan F1 merah muda, lalu F1 disilangkan kembali dengan induk putih (backcross), keturunannya akan berfenotip...",options:["50% Merah Muda dan 50% Putih","100% Merah Muda","50% Merah dan 50% Putih","75% Merah Muda dan 25% Putih"],answer:"50% Merah Muda dan 50% Putih",explanation:"Persilangan intermediet Mm (merah muda) × mm (putih) menghasilkan 50% Mm (merah muda) dan 50% mm (putih).",hint:"Buat papan catur 2x1 untuk persilangan Mm dengan mm.",xp:200,difficulty:4},{id:"q6_15",level:6,cognitiveLevel:"C4",category:"analysis",type:"true_false",question:"Hukum Segregasi dan Hukum Asortasi Bebas dapat diamati secara serentak pada persilangan dihibrid.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Dalam persilangan dihibrid, masing-masing pasangan alel mengalami pemisahan (Hukum I) sekaligus saling berasortasi bebas antar-pasangan (Hukum II).",hint:"Persilangan dua sifat beda memuat kedua hukum Mendel sekaligus.",xp:200,difficulty:4},{id:"q6_16",level:6,cognitiveLevel:"C5",category:"analysis",type:"analysis_challenge",question:"Sintesis Kritis: Mengapa Hukum Asortasi Bebas Mendel TIDAK berlaku jika dua gen terpaut rapat pada kromosom yang sama tanpa pindah silang?",options:["Karena alel-alel tersebut terletak pada satu molekul DNA fisik yang sama sehingga bergerak bersama ke kutub sel saat meiosis","Karena alel dominan menghancurkan alel resesif","Karena sel menolak melakukan meiosis","Karena pembelahan sel berubah menjadi mitosis"],answer:"Karena alel-alel tersebut terletak pada satu molekul DNA fisik yang sama sehingga bergerak bersama ke kutub sel saat meiosis",explanation:"Gen-gen yang terpaut (linked genes) berada pada kromosom fisik yang sama, sehingga saat kromosom tersebut bergerak ke kutub anafase, kedua gen terbawa bersama tanpa segregasi independen.",hint:"Pikirkan struktur fisik kromosom sebagai satu kesatuan paket pembawa materi genetik.",xp:250,difficulty:5},{id:"q6_17",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Evaluasi Data Ilmiah: Seorang ilmuwan menyilangkan tanaman berbiji licin-hijau (heterozigot ganda) dengan sesamanya. Dari 1.600 keturunan, data yang paling mendekati kepatuhan sempurna terhadap Hukum Mendel II adalah...",options:["905 licin-hijau, 298 licin-putih, 302 keriput-hijau, 95 keriput-putih","400 licin-hijau, 400 licin-putih, 400 keriput-hijau, 400 keriput-putih","1.200 licin-hijau, 400 keriput-putih","1.600 licin-hijau"],answer:"905 licin-hijau, 298 licin-putih, 302 keriput-hijau, 95 keriput-putih",explanation:"Rasio teoritis 9:3:3:1 dari 1.600 adalah 900 : 300 : 300 : 100. Angka 905 : 298 : 302 : 95 adalah representasi empiris yang sangat presisi.",hint:"Cari angka yang mendekati rasio teoritis 900 : 300 : 300 : 100.",xp:250,difficulty:5},{id:"q6_18",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika seseorang ingin memprediksi persentase keturunan yang bergenotip heterozigot untuk SEMUA lokus pada persilangan AaBbCc × AaBbCc, rumus perhitungannya adalah...",options:["(1/2) × (1/2) × (1/2) = 1/8 (12,5%)","(1/4)^3 = 1/64","(3/4)^3 = 27/64","1/2 (50%)"],answer:"(1/2) × (1/2) × (1/2) = 1/8 (12,5%)",explanation:"Peluang heterozigot (Aa) dari Aa × Aa adalah 2/4 = 1/2. Untuk 3 lokus independen: (1/2) × (1/2) × (1/2) = 1/8 (12,5%).",hint:"Peluang heterozigot per pasang gen adalah 50% (1/2).",xp:250,difficulty:5},{id:"q6_19",level:6,cognitiveLevel:"C5",category:"analysis",type:"true_false",question:"Pindah silang (crossing over) pada profase I meiosis dapat memecah keterpautan gen dan menghasilkan rekombinasi baru yang memperkaya variasi genetik.",options:["Benar","Salah"],answer:"Benar",explanation:"Benar. Pindah silang menukar segmen kromatid non-saudara pada pasangan kromosom homolog sehingga menghasilkan kombinasi alel rekombinan.",hint:"Pertukaran materi genetik antar kromatid menghasilkan kombinasi baru.",xp:250,difficulty:5},{id:"q6_20",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Dalam aplikasi pemuliaan tanaman modern, prinsip Hukum Mendel dimanfaatkan oleh para peneliti pertanian untuk...",options:["Menghasilkan varietas bibit unggul berdaya hasil tinggi dan tahan hama secara terencana","Menghentikan seluruh proses evolusi tanaman","Menghilangkan keanekaragaman hayati","Memaksa semua tanaman berbunga pada waktu yang sama"],answer:"Menghasilkan varietas bibit unggul berdaya hasil tinggi dan tahan hama secara terencana",explanation:"Hukum Mendel memungkinkan pemulia tanaman memprediksi dan mengombinasikan sifat-sifat unggul (seperti tahan hama dan berproduksi tinggi) ke dalam satu galur tanaman bibit unggul.",hint:"Tujuan utama persilangan dalam bidang pangan dan pertanian.",xp:250,difficulty:5},{id:"q6_21",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Perhatikan bagan: P1: AAbb × aaBB -> F1: AaBb. Jika F1 disilangkan dengan sesamanya, fraksi keturunan F2 yang memiliki genotip SAMA PERSIS dengan salah satu induk P1 adalah...",options:["2/16 (1/16 AAbb + 1/16 aaBB)","4/16","1/16","9/16"],answer:"2/16 (1/16 AAbb + 1/16 aaBB)",explanation:"Frekuensi genotip AAbb adalah 1/16 dan aaBB adalah 1/16. Total peluang keturunan bergenotip sama dengan salah satu induk P1 adalah 1/16 + 1/16 = 2/16 (1/8).",hint:"Jumlahkan peluang kemunculan genotip AAbb dengan peluang kemunculan genotip aaBB pada papan catur.",xp:250,difficulty:5},{id:"q6_22",level:6,cognitiveLevel:"C5",category:"analysis",type:"true_false",question:'Gelar "Mendel Master" layak disematkan kepada siswa yang mampu memahami konsep dasar pewarisan sifat, menghitung rasio persilangan secara tepat, dan menganalisis data secara kritis.',options:["Benar","Salah"],answer:"Benar",explanation:"Benar! Penguasaan utuh atas prinsip Segregasi dan Asortasi Bebas Mendel menjadikan seorang siswa kompeten dalam ilmu pewarisan sifat.",hint:"Misi utama petualangan game edukasi ini!",xp:250,difficulty:5},{id:"q6_23",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Jika seekor organisme model fiktif bergenotip KkLlMm berasortasi bebas, berapakah jumlah kotak papan catur Punnett yang dibutuhkan untuk persilangan dengan sesamanya?",options:["64 kotak (8 × 8)","16 kotak","32 kotak","256 kotak"],answer:"64 kotak (8 × 8)",explanation:"Masing-masing induk menghasilkan 2^3 = 8 macam gamet, sehingga tabel Punnett membutuhkan 8 × 8 = 64 kotak kombinasi.",hint:"8 gamet dikali 8 gamet.",xp:250,difficulty:5},{id:"q6_24",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Analisis Mutasi: Sebuah alel dominan mengalami mutasi delesi sehingga kehilangan fungsinya dan berperilaku seperti alel resesif. Perubahan ini terjadi pada tingkat...",options:["Urutan basa nitrogen rantai nukleotida DNA","Jumlah sel tubuh","Bentuk luar organel kloroplas","Dinding sel selulosa"],answer:"Urutan basa nitrogen rantai nukleotida DNA",explanation:"Mutasi gen adalah perubahan pada susunan basa nitrogen DNA yang menyusun kode genetik gen tersebut.",hint:"Tingkat molekuler terkecil pembawa kode sandi genetik.",xp:250,difficulty:5},{id:"q6_25",level:6,cognitiveLevel:"C5",category:"analysis",type:"multiple_choice",question:"Pernyataan pamungkas: Manakah dari kesimpulan berikut yang paling tepat merangkum kontribusi terbesar Gregor Mendel dalam ilmu biologi modern?",options:["Menemukan bahwa sifat diwariskan dalam unit-unit diskret (faktor genetik/gen) yang tidak bercampur dan mematuhi hukum matematika probabilitas","Menemukan struktur heliks ganda DNA dengan mikroskop elektron","Membuktikan bahwa semua sifat organisme ditentukan oleh faktor lingkungan semata","Menciptakan teknologi kloning pertama di dunia"],answer:"Menemukan bahwa sifat diwariskan dalam unit-unit diskret (faktor genetik/gen) yang tidak bercampur dan mematuhi hukum matematika probabilitas",explanation:'Mendel mematahkan teori "blending inheritance" (pewarisan sifat cair bercampur) dan membuktikan bahwa sifat diturunkan sebagai partikel/faktor diskret (kini disebut gen) yang mematuhi hukum probabilitas statistik.',hint:"Sifat diturunkan sebagai unit terpisah (partikulat) dan mengikuti hukum matematika statistik.",xp:250,difficulty:5}],Wl=[{id:1,name:"GEN LAB",subtitle:"Dasar Genetika & Istilah Kunci",theme:"Laboratorium Genetika Modern",enemyName:"Gene Goblin",enemyHp:300,bossName:"GENE GOBLIN KING",bossHp:300,bossTheme:"Mutan Genetik Pembobol Data",description:"Pahami konsep gen, alel, DNA, kromosom, genotip, fenotip, dominan, resesif, homozigot, dan heterozigot.",learningFocus:"Konsep Dasar Materi Genetik",achievementId:"ach_gen_explorer",crystalId:1},{id:2,name:"FLOWER LAB",subtitle:"Monohibrid & Hukum Mendel I",theme:"Laboratorium Botani Bunga Eksperimental",enemyName:"Drone Pollinator",enemyHp:350,bossName:"FLOWER GUARDIAN",bossHp:500,bossTheme:"Penjaga Bunga Heterozigot",description:"Pelajari persilangan monohibrid, dominansi penuh dan intermediet, pemisahan gamet, dan Hukum Segregasi (Mendel I).",learningFocus:"Persilangan Monohibrid & Hukum Segregasi",achievementId:"ach_monohybrid_apprentice",crystalId:2},{id:3,name:"RABBIT LAB",subtitle:"Dihibrid & Hukum Mendel II",theme:"Laboratorium Genetika Mamalia Kelinci",enemyName:"Robo Bunny Guard",enemyHp:400,bossName:"GENETIC RABBIT KING",bossHp:800,bossTheme:"Raja Kelinci Dihibrid 4x4",description:"Bentuk 4 macam gamet dari heterozigot ganda BbLl, bangun papan catur 4x4, dan pecahkan rasio fenotip 9:3:3:1.",learningFocus:"Dihibrid & Hukum Asortasi Bebas",achievementId:"ach_punnett_apprentice",crystalId:3},{id:4,name:"MYSTERY LAB",subtitle:"Detektif Sifat Resesif",theme:"Laboratorium Arsip & Investigasi Spesimen",enemyName:"Shadow Specimen",enemyHp:450,bossName:"GENETIC MYSTERY",bossHp:850,bossTheme:"Anomali Resesif Tersembunyi",description:"Telusuri pembawa sifat (carrier), uji silang (testcross), dan mekanisme bagaimana sifat resesif dapat m
